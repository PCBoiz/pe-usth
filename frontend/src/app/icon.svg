<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Programming EDU">
  <!-- Favicon thương hiệu. Thay cho src/app/favicon.ico, file đó là bản MẶC
       ĐỊNH của create-next-app (tam giác Vercel, 25 931 byte, 16+32px), và
       trong App Router `favicon.ico` THẮNG `metadata.icons`, nên biểu tượng
       tên lửa khai ở layout.tsx chưa bao giờ hiện ra. Một người thử ngày 27/10
       nhận ra: "Favicon hình như là default của Vercel".

       Vì sao là `>_` chứ không phải chữ "PE": ở 16px thì hai chữ cái dính vào
       nhau thành một vệt. Dấu nhắc dòng lệnh giữ được hình ở cỡ đó và nói đúng
       việc trang này làm.

       Gradient lấy từ biến edu-g-brand (edu-theme.css): xanh #1f5fe0 sang đỏ
       #e5334b, đúng cặp màu của chữ "Programming EDU" trên thanh đầu. -->
  <defs>
    <linearGradient id="pe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f5fe0"/>
      <stop offset="52%" stop-color="#4f8dff"/>
      <stop offset="64%" stop-color="#ff5a6e"/>
      <stop offset="100%" stop-color="#e5334b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#pe)"/>
  <!-- Nét dày 6 và không có chi tiết nhỏ nào: ở 16px mọi nét mảnh hơn sẽ nhoè
       thành một vệt xám. -->
  <path d="M18 22 L28 32 L18 42" fill="none" stroke="#fff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 44 H48" fill="none" stroke="#fff" stroke-width="6"
        stroke-linecap="round"/>
</svg>
