<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="g02-title g02-desc">
<title id="g02-title">Button và callback: lúc dựng khác lúc bấm</title>
<desc id="g02-desc">Vòng lặp 10,7 giây, 6 bước giữ mỗi bước khoảng 1,8 giây: (1) lúc dựng, command=onClick trao THAM CHIẾU hàm cho Button chứ không gọi; (2) người dùng bấm chuột; (3) mainloop lấy sự kiện Button-1 khỏi hàng đợi; (4) Tk gọi onClick() trên luồng giao diện; (5) onClick gọi label.config đổi chữ; (6) giữ lâu trên Label đã đổi chữ. Khi tắt hoạt hình, hình đứng ở trạng thái đầy đủ: Label đã mang chữ mới.</desc>
<style>
  text{font-family:'Segoe UI',system-ui,sans-serif;fill:#e8edf7}
  .t{font-size:27px;font-weight:600}
  .sub{font-size:15px;fill:#93a0bc}
  .eye{font-size:13px;font-weight:600;letter-spacing:.6px}
  .h{font-size:15px;font-weight:600}
  .sm{font-size:13px;fill:#93a0bc}
  .dim{font-size:12px;fill:#5b6886}
  .m{font-family:Consolas,'Cascadia Mono','Courier New',monospace;font-size:13px;fill:#e8edf7}
  .ms{font-family:Consolas,'Cascadia Mono','Courier New',monospace;font-size:12px;fill:#93a0bc}
  .panel{fill:#162036;stroke:#273352;stroke-width:1.5}
  .card{fill:#1a2440;stroke:#2f3d60;stroke-width:1.4}
  .win{fill:#10192c;stroke:#273352;stroke-width:1.6}
  .bar{fill:#1d2a46}
  .glow{fill:none;stroke-width:2.6;opacity:0}

  /* Snap ~53ms rồi GIỮ 1,8s: người học kịp đọc từng chặng. Chỉ làm rõ THỨ TỰ. */
  /* Nhịp đã chia cho 1,5 so với bản đầu — tester xem bản live nói chậm quá. Vì thế thời lượng
     và delay là số lẻ (làm tròn 2 chữ số). Mốc % trong @keyframes KHÔNG đổi (đó là tỉ lệ),
     còn delay chia cùng hệ số để các lớp hình không lệch pha. */
  .s1{animation:k1 10.67s linear infinite}
  .s2{animation:k2 10.67s linear infinite}
  .s3{animation:k3 10.67s linear infinite}
  .s4{animation:k4 10.67s linear infinite}
  .s5{animation:k5 10.67s linear infinite}
  .s6{animation:k6 10.67s linear infinite}
  @keyframes k1{0%,16.2%{opacity:1}16.7%,100%{opacity:0}}
  @keyframes k2{0%,16.2%{opacity:0}16.7%,32.8%{opacity:1}33.3%,100%{opacity:0}}
  @keyframes k3{0%,32.8%{opacity:0}33.3%,49.5%{opacity:1}50%,100%{opacity:0}}
  @keyframes k4{0%,49.5%{opacity:0}50%,66.2%{opacity:1}66.7%,100%{opacity:0}}
  @keyframes k5{0%,66.2%{opacity:0}66.7%,82.8%{opacity:1}83.3%,100%{opacity:0}}
  @keyframes k6{0%,82.8%{opacity:0}83.3%,100%{opacity:1}}

  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>

<rect width="1280" height="640" fill="#0f1626"/>
<defs>
  <marker id="g02-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#93a0bc"/></marker>
  <marker id="g02-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4c9bff"/></marker>
  <marker id="g02-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9fd88f"/></marker>
</defs>

<text class="t" x="48" y="54">Button gọi callback: <tspan fill="#f5b83d">lúc dựng</tspan> khác <tspan fill="#9fd88f">lúc bấm</tspan></text>
<text class="sub" x="48" y="80">command nhận TÊN hàm (tham chiếu). Tk giữ lại, rồi mới gọi khi người dùng bấm.</text>

<!-- ======================= BĂNG 1: LÚC DỰNG ======================= -->
<text class="eye" x="48" y="108" fill="#f5b83d">LÚC DỰNG GIAO DIỆN — chạy một lần, trước mainloop()</text>
<rect class="panel" x="48" y="118" width="1184" height="162" rx="10"/>

<rect class="card" x="72" y="140" width="306" height="120" rx="8"/>
<text class="h" x="88" y="164" fill="#79d3ec">Hàm xử lý</text>
<text class="m" x="88" y="192">def onClick():</text>
<text class="m" x="88" y="212" xml:space="preserve">    label.config(</text>
<text class="m" x="88" y="232" xml:space="preserve">        text=<tspan fill="#9fd88f">"Đã bấm Button 1"</tspan>)</text>

<line x1="382" y1="200" x2="540" y2="200" stroke="#4c9bff" stroke-width="1.8" marker-end="url(#g02-b)"/>
<rect x="382" y="170" width="166" height="22" fill="#162036"/>
<text class="ms" x="465" y="186" text-anchor="middle" fill="#4c9bff">(1) command=onClick</text>
<rect x="382" y="208" width="166" height="22" fill="#162036"/>
<text class="ms" x="463" y="224" text-anchor="middle">trao tham chiếu</text>

<rect class="card" x="546" y="140" width="306" height="120" rx="8"/>
<text class="h" x="562" y="164" fill="#4c9bff">Widget Button</text>
<text class="m" x="562" y="192">tk.Button(window,</text>
<text class="m" x="562" y="212" xml:space="preserve">    text=<tspan fill="#9fd88f">"Button 1"</tspan>,</text>
<text class="m" x="562" y="232" xml:space="preserve">    command=onClick)  <tspan fill="#5b6886"># không có ()</tspan></text>

<rect class="card" x="880" y="140" width="328" height="120" rx="8" stroke="#f4a274"/>
<text class="eye" x="896" y="164" fill="#f4a274">BẪY THƯỜNG GẶP</text>
<text class="m" x="896" y="192">command=onClick()   <tspan fill="#f4a274">✗</tspan></text>
<text class="ms" x="896" y="214">có () là GỌI NGAY lúc dựng, rồi trao</text>
<text class="ms" x="896" y="232">kết quả None — bấm sẽ không chạy gì.</text>

<!-- ======================= BĂNG 2: LÚC BẤM ======================= -->
<text class="eye" x="48" y="308" fill="#9fd88f">LÚC NGƯỜI DÙNG BẤM — mainloop() đang chạy</text>
<rect class="panel" x="48" y="318" width="1184" height="286" rx="10"/>

<!-- cửa sổ mẫu -->
<rect class="win" x="72" y="344" width="300" height="234" rx="9"/>
<path class="bar" d="M72,353 a9,9 0 0 1 9,-9 h282 a9,9 0 0 1 9,9 v24 h-300 z"/>
<circle cx="92" cy="361" r="5" fill="#f4a274"/><circle cx="108" cy="361" r="5" fill="#f5b83d"/><circle cx="124" cy="361" r="5" fill="#9fd88f"/>
<text class="ms" x="222" y="366" text-anchor="middle" fill="#e8edf7">Tkinter widgets</text>
<rect x="104" y="408" width="236" height="34" rx="5" fill="#1a2440" stroke="#9fd88f" stroke-width="1.4"/>
<text class="m" x="222" y="430" text-anchor="middle" fill="#9fd88f">Đã bấm Button 1</text>
<text class="dim" x="222" y="462" text-anchor="middle">Label (chữ sau khi bấm)</text>
<rect x="144" y="488" width="156" height="36" rx="6" fill="#243352" stroke="#4c9bff" stroke-width="1.4"/>
<text class="m" x="222" y="511" text-anchor="middle">Button 1</text>
<text class="dim" x="222" y="546" text-anchor="middle">Button (command=onClick)</text>

<!-- chuỗi 4 chặng -->
<rect class="card" x="400" y="372" width="176" height="146" rx="8"/>
<text class="eye" x="416" y="396" fill="#93a0bc">(2) BẤM CHUỘT</text>
<text class="sm" x="416" y="424" fill="#e8edf7">Người dùng nhấn</text>
<text class="sm" x="416" y="444" fill="#e8edf7">vào Button 1</text>
<text class="ms" x="416" y="474">hệ điều hành báo</text>
<text class="ms" x="416" y="492">cho Tk một sự kiện</text>

<rect class="card" x="608" y="372" width="176" height="146" rx="8"/>
<text class="eye" x="624" y="396" fill="#93a0bc">(3) MAINLOOP</text>
<text class="m" x="624" y="424" fill="#79d3ec">&lt;Button-1&gt;</text>
<text class="ms" x="624" y="450">vào hàng đợi sự kiện</text>
<text class="ms" x="624" y="468">mainloop() lấy ra và</text>
<text class="ms" x="624" y="486">tra xem ai đăng ký</text>

<rect class="card" x="816" y="372" width="176" height="146" rx="8"/>
<text class="eye" x="832" y="396" fill="#93a0bc">(4) TK GỌI HÀM</text>
<text class="m" x="832" y="424" fill="#4c9bff">onClick()</text>
<text class="ms" x="832" y="450">chạy trên CHÍNH luồng</text>
<text class="ms" x="832" y="468">giao diện — mainloop</text>
<text class="ms" x="832" y="486">đứng chờ nó xong</text>

<rect class="card" x="1024" y="372" width="176" height="146" rx="8"/>
<text class="eye" x="1040" y="396" fill="#93a0bc">(5) ĐỔI CHỮ</text>
<text class="m" x="1040" y="424" fill="#9fd88f">label.config(</text>
<text class="m" x="1040" y="442" fill="#9fd88f" xml:space="preserve">    text=…)</text>
<text class="ms" x="1040" y="468">widget nhớ chữ mới</text>
<text class="ms" x="1040" y="486">và xin vẽ lại</text>

<line x1="580" y1="445" x2="604" y2="445" stroke="#93a0bc" stroke-width="1.6" marker-end="url(#g02-a)"/>
<line x1="788" y1="445" x2="812" y2="445" stroke="#93a0bc" stroke-width="1.6" marker-end="url(#g02-a)"/>
<line x1="996" y1="445" x2="1020" y2="445" stroke="#93a0bc" stroke-width="1.6" marker-end="url(#g02-a)"/>
<line x1="376" y1="445" x2="396" y2="445" stroke="#93a0bc" stroke-width="1.6" marker-end="url(#g02-a)"/>

<!-- đường vẽ lại quay về Label -->
<path d="M1112,522 V556 H386" fill="none" stroke="#9fd88f" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#g02-c)"/>
<rect x="640" y="546" width="220" height="22" fill="#162036"/>
<text class="ms" x="750" y="562" text-anchor="middle" fill="#9fd88f">(6) Label vẽ lại chữ mới</text>

<!-- ======================= nhấn theo bước ======================= -->
<rect class="glow s1" x="376" y="162" width="174" height="76" rx="8" stroke="#4c9bff"/>
<rect class="glow s2" x="396" y="368" width="184" height="154" rx="10" stroke="#f5b83d"/>
<rect class="glow s3" x="604" y="368" width="184" height="154" rx="10" stroke="#f5b83d"/>
<rect class="glow s4" x="812" y="368" width="184" height="154" rx="10" stroke="#f5b83d"/>
<rect class="glow s5" x="1020" y="368" width="184" height="154" rx="10" stroke="#f5b83d"/>
<rect class="glow s6" x="98" y="402" width="248" height="46" rx="8" stroke="#9fd88f"/>
<path class="glow s6" d="M1112,522 V556 H386" stroke="#9fd88f" stroke-width="3.4"/>
<rect class="glow s2" x="138" y="482" width="168" height="48" rx="9" stroke="#f5b83d"/>
</svg>
