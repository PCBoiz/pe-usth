<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t04-title t04-desc">
<title id="t04-title">GIL: nhiều thread, một trình thông dịch</title>
<desc id="t04-desc">Bên trái, việc nặng CPU: các lát thời gian trên một nhân luân phiên T1, T2, T1, T2 vì mỗi lát đều phải giữ GIL; máy bốn nhân thì ba nhân còn lại nằm không; hai thread tốn đúng 4,0 giây như một thread. Bên phải, việc chờ I/O: thread nhả GIL trong suốt lúc chờ nên thread kia chạy chen vào, hai thread chỉ tốn 2,1 giây thay vì 4,0 giây. Vòng lặp 18 giây, 7 bước, hai bước then chốt giữ 3,3 giây: bước kết quả CPU-bound và bước T1 nhả GIL cho T2.</desc>
<defs>
<pattern id="t04wait" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#1a2b22"/>
  <line x1="0" y1="0" x2="0" y2="8" stroke="#3f6b4e" stroke-width="3"/>
</pattern>
<pattern id="t04idle" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#161d2e"/>
  <line x1="0" y1="0" x2="0" y2="8" stroke="#2e3752" stroke-width="3"/>
</pattern>
<marker id="t04ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="#5b6886"/>
</marker>
</defs>
<style>
  text{fill:#e8edf7;font-family:'Segoe UI',system-ui,sans-serif}
  .mono{font-family:Consolas,'Cascadia Mono','Courier New',monospace}
  .h1{font-size:25px;font-weight:600}
  .sub{font-size:14px;fill:#93a0bc}
  .ph{font-size:16px;font-weight:600}
  .cap{font-size:12px;fill:#5b6886}
  .bd{font-size:13px;fill:#93a0bc}
  .ring{fill:none;stroke-width:2.5;opacity:0;animation-duration:18s;animation-timing-function:linear;animation-iteration-count:infinite}
  .k1{animation-name:k1}.k2{animation-name:k2}.k3{animation-name:k3}.k4{animation-name:k4}
  .k5{animation-name:k5}.k6{animation-name:k6}.k7{animation-name:k7}
  @keyframes k1{0%{opacity:1}11.7%{opacity:1}12.2%{opacity:0}100%{opacity:0}}
  @keyframes k2{0%{opacity:0}12.2%{opacity:0}12.7%{opacity:1}23.9%{opacity:1}24.4%{opacity:0}100%{opacity:0}}
  @keyframes k3{0%{opacity:0}24.4%{opacity:0}24.9%{opacity:1}36.1%{opacity:1}36.6%{opacity:0}100%{opacity:0}}
  @keyframes k4{0%{opacity:0}36.6%{opacity:0}37.1%{opacity:1}56.1%{opacity:1}56.6%{opacity:0}100%{opacity:0}}
  @keyframes k5{0%{opacity:0}56.6%{opacity:0}57.1%{opacity:1}68.3%{opacity:1}68.8%{opacity:0}100%{opacity:0}}
  @keyframes k6{0%{opacity:0}68.8%{opacity:0}69.3%{opacity:1}88.3%{opacity:1}88.8%{opacity:0}100%{opacity:0}}
  @keyframes k7{0%{opacity:0}88.8%{opacity:0}89.3%{opacity:1}99.5%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="1280" height="640" fill="#0f1626"/>

<text class="h1" x="40" y="50">GIL: nhiều thread, một trình thông dịch</text>
<text class="sub" x="40" y="78">CPython có đúng một GIL. Thread nào muốn chạy bytecode Python phải giữ nó — nên việc nặng CPU không nhanh lên, còn việc chờ I/O thì có.</text>

<!-- ============ PANEL A: CPU-BOUND ============ -->
<rect x="40" y="100" width="584" height="416" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="60" y="130" fill="#f4a274">1 · Việc nặng CPU — không nhanh hơn</text>
<text class="cap" x="60" y="152">Lát nào cũng cần GIL, nên hai thread chỉ thay phiên nhau.</text>

<text class="mono" x="60" y="196" font-size="11.5" fill="#93a0bc">1 nhân CPU</text>
<rect x="138" y="172" width="55" height="34" rx="4" fill="#1b2a47" stroke="#4c9bff"/>
<text x="165" y="194" font-size="12" text-anchor="middle" fill="#9cc6ff">T1</text>
<rect x="196" y="172" width="55" height="34" rx="4" fill="#231c3a" stroke="#c9a2ff"/>
<text x="223" y="194" font-size="12" text-anchor="middle" fill="#c9a2ff">T2</text>
<rect x="254" y="172" width="55" height="34" rx="4" fill="#1b2a47" stroke="#4c9bff"/>
<text x="281" y="194" font-size="12" text-anchor="middle" fill="#9cc6ff">T1</text>
<rect x="312" y="172" width="55" height="34" rx="4" fill="#231c3a" stroke="#c9a2ff"/>
<text x="339" y="194" font-size="12" text-anchor="middle" fill="#c9a2ff">T2</text>
<rect x="370" y="172" width="55" height="34" rx="4" fill="#1b2a47" stroke="#4c9bff"/>
<text x="397" y="194" font-size="12" text-anchor="middle" fill="#9cc6ff">T1</text>
<rect x="428" y="172" width="55" height="34" rx="4" fill="#231c3a" stroke="#c9a2ff"/>
<text x="455" y="194" font-size="12" text-anchor="middle" fill="#c9a2ff">T2</text>
<rect x="486" y="172" width="55" height="34" rx="4" fill="#1b2a47" stroke="#4c9bff"/>
<text x="513" y="194" font-size="12" text-anchor="middle" fill="#9cc6ff">T1</text>
<rect x="544" y="172" width="55" height="34" rx="4" fill="#231c3a" stroke="#c9a2ff"/>
<text x="571" y="194" font-size="12" text-anchor="middle" fill="#c9a2ff">T2</text>
<rect class="ring k1" x="134" y="168" width="63" height="42" rx="5" stroke="#4c9bff"/>
<rect class="ring k2" x="192" y="168" width="63" height="42" rx="5" stroke="#c9a2ff"/>
<rect class="ring k3" x="250" y="168" width="353" height="42" rx="5" stroke="#79d3ec"/>

<line x1="138" y1="220" x2="599" y2="220" stroke="#5b6886" stroke-width="1.4" marker-end="url(#t04ar)"/>
<text class="cap" x="368" y="238" text-anchor="middle">thời gian</text>

<text class="bd" x="60" y="262">Máy 4 nhân cũng không cứu được:</text>
<rect x="60" y="272" width="130" height="46" rx="6" fill="#1b2a47" stroke="#4c9bff"/>
<text x="125" y="292" font-size="11.5" text-anchor="middle" fill="#9cc6ff">nhân 0</text>
<text x="125" y="309" font-size="10.5" text-anchor="middle" fill="#9cc6ff">T1 đang giữ GIL</text>
<rect x="196" y="272" width="130" height="46" rx="6" fill="url(#t04idle)" stroke="#2c3a5c"/>
<text x="261" y="292" font-size="11.5" text-anchor="middle" fill="#93a0bc">nhân 1</text>
<text x="261" y="309" font-size="10.5" text-anchor="middle" fill="#5b6886">nằm không</text>
<rect x="332" y="272" width="130" height="46" rx="6" fill="url(#t04idle)" stroke="#2c3a5c"/>
<text x="397" y="292" font-size="11.5" text-anchor="middle" fill="#93a0bc">nhân 2</text>
<text x="397" y="309" font-size="10.5" text-anchor="middle" fill="#5b6886">nằm không</text>
<rect x="468" y="272" width="130" height="46" rx="6" fill="url(#t04idle)" stroke="#2c3a5c"/>
<text x="533" y="292" font-size="11.5" text-anchor="middle" fill="#93a0bc">nhân 3</text>
<text x="533" y="309" font-size="10.5" text-anchor="middle" fill="#5b6886">nằm không</text>
<rect class="ring k3" x="56" y="268" width="546" height="54" rx="7" stroke="#79d3ec"/>

<text class="bd" x="60" y="346">Tổng thời gian:</text>
<text x="60" y="374" font-size="12" fill="#93a0bc">1 thread</text>
<rect x="138" y="356" width="462" height="24" rx="4" fill="#1b2a47" stroke="#4c9bff"/>
<text x="590" y="373" font-size="12" text-anchor="end" fill="#9cc6ff">4,0 s</text>
<text x="60" y="404" font-size="12" fill="#93a0bc">2 thread</text>
<rect x="138" y="386" width="462" height="24" rx="4" fill="#231c3a" stroke="#c9a2ff"/>
<text x="590" y="403" font-size="12" text-anchor="end" fill="#c9a2ff">4,0 s — y hệt</text>
<rect class="ring k4" x="54" y="350" width="552" height="66" rx="7" stroke="#f5b83d"/>

<rect x="60" y="428" width="540" height="72" rx="8" fill="#241a1a" stroke="#f5b83d"/>
<text class="bd" x="74" y="452" fill="#f5b83d">Hai thread CPU-bound KHÔNG nhanh hơn một thread: chúng chỉ</text>
<text class="bd" x="74" y="472" fill="#f5b83d">luân phiên trên cùng một GIL. Muốn nhanh thật thì dùng</text>
<text class="bd" x="74" y="492" fill="#f5b83d">multiprocessing — mỗi process một trình thông dịch, một GIL riêng.</text>
<rect class="ring k4" x="64" y="432" width="532" height="64" rx="7" stroke="#f5b83d"/>

<!-- ============ PANEL B: I/O-BOUND ============ -->
<rect x="656" y="100" width="584" height="416" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="676" y="130" fill="#9fd88f">2 · Việc chờ I/O — nhanh lên thật</text>
<text class="cap" x="676" y="152">Lúc chờ mạng hay đĩa, thread NHẢ GIL ra cho thread khác chạy.</text>

<text class="mono" x="676" y="198" font-size="11.5" fill="#93a0bc">T1</text>
<rect x="712" y="176" width="60" height="36" rx="4" fill="#1b2a47" stroke="#4c9bff"/>
<text x="742" y="199" font-size="11" text-anchor="middle" fill="#9cc6ff">GIL</text>
<rect x="775" y="176" width="300" height="36" rx="4" fill="url(#t04wait)" stroke="#9fd88f"/>
<text x="925" y="199" font-size="11" text-anchor="middle" fill="#9fd88f">chờ I/O — ĐÃ NHẢ GIL</text>
<rect x="1078" y="176" width="60" height="36" rx="4" fill="#1b2a47" stroke="#4c9bff"/>
<text x="1108" y="199" font-size="11" text-anchor="middle" fill="#9cc6ff">GIL</text>

<text class="mono" x="676" y="242" font-size="11.5" fill="#93a0bc">T2</text>
<rect x="712" y="220" width="60" height="36" rx="4" fill="url(#t04idle)" stroke="#2c3a5c"/>
<text x="742" y="243" font-size="10" text-anchor="middle" fill="#5b6886">chờ GIL</text>
<rect x="775" y="220" width="60" height="36" rx="4" fill="#231c3a" stroke="#c9a2ff"/>
<text x="805" y="243" font-size="11" text-anchor="middle" fill="#c9a2ff">GIL</text>
<rect x="838" y="220" width="300" height="36" rx="4" fill="url(#t04wait)" stroke="#9fd88f"/>
<text x="988" y="243" font-size="11" text-anchor="middle" fill="#9fd88f">chờ I/O — ĐÃ NHẢ GIL</text>
<rect x="1141" y="220" width="60" height="36" rx="4" fill="#231c3a" stroke="#c9a2ff"/>
<text x="1171" y="243" font-size="11" text-anchor="middle" fill="#c9a2ff">GIL</text>

<line x1="773.5" y1="168" x2="773.5" y2="264" stroke="#79d3ec" stroke-width="1.6" stroke-dasharray="4 4"/>
<text x="780" y="166" font-size="10.5" fill="#79d3ec">T1 nhả GIL → T2 chạy ngay</text>

<rect class="ring k5" x="708" y="172" width="68" height="44" rx="5" stroke="#4c9bff"/>
<rect class="ring k6" x="708" y="168" width="371" height="96" rx="5" stroke="#9fd88f"/>

<line x1="712" y1="276" x2="1216" y2="276" stroke="#5b6886" stroke-width="1.4" marker-end="url(#t04ar)"/>
<text class="cap" x="960" y="294" text-anchor="middle">thời gian</text>

<text class="bd" x="676" y="346">Tổng thời gian:</text>
<text x="676" y="374" font-size="12" fill="#93a0bc">1 thread</text>
<rect x="754" y="356" width="462" height="24" rx="4" fill="#1b2a47" stroke="#4c9bff"/>
<text x="1206" y="373" font-size="12" text-anchor="end" fill="#9cc6ff">4,0 s</text>
<text x="676" y="404" font-size="12" fill="#93a0bc">2 thread</text>
<rect x="754" y="386" width="243" height="24" rx="4" fill="#1a2b22" stroke="#9fd88f"/>
<text x="1009" y="403" font-size="12" fill="#9fd88f">2,1 s — nhanh gần gấp đôi</text>
<rect class="ring k7" x="670" y="350" width="552" height="66" rx="7" stroke="#9fd88f"/>

<rect x="676" y="428" width="544" height="72" rx="8" fill="#15251c" stroke="#9fd88f"/>
<text class="bd" x="690" y="452" fill="#9fd88f">Phần lớn thời gian là CHỜ chứ không phải tính. Trong lúc chờ,</text>
<text class="bd" x="690" y="472" fill="#9fd88f">GIL được nhả ra nên thread khác chen vào chạy được.</text>
<text class="bd" x="690" y="492" fill="#9fd88f">Đa luồng có lợi THẬT với I/O: tải nhiều URL, đọc nhiều file.</text>
<rect class="ring k7" x="680" y="432" width="536" height="64" rx="7" stroke="#9fd88f"/>

<!-- ============ CHU GIAI ============ -->
<rect x="40" y="532" width="1200" height="52" rx="8" fill="#162036" stroke="#273352"/>
<rect x="60" y="550" width="22" height="16" rx="3" fill="#1b2a47" stroke="#4c9bff"/>
<text x="92" y="563" font-size="12" fill="#93a0bc">T1 đang giữ GIL</text>
<rect x="240" y="550" width="22" height="16" rx="3" fill="#231c3a" stroke="#c9a2ff"/>
<text x="272" y="563" font-size="12" fill="#93a0bc">T2 đang giữ GIL</text>
<rect x="420" y="550" width="22" height="16" rx="3" fill="url(#t04wait)" stroke="#9fd88f"/>
<text x="452" y="563" font-size="12" fill="#93a0bc">chờ I/O — đã nhả GIL (thread khác chạy được)</text>
<rect x="800" y="550" width="22" height="16" rx="3" fill="url(#t04idle)" stroke="#2c3a5c"/>
<text x="832" y="563" font-size="12" fill="#93a0bc">chờ tới lượt / nhân nằm không — vẫn cần GIL mới chạy được</text>

<text class="cap" x="40" y="612">Nguồn: slide USTH 86-89 (GIL là gì, vì sao có, bỏ đi thì mất gì), 93-94 (lát thời gian trên một nhân và trên nhiều nhân).</text>
<text class="cap" x="40" y="630">Ngoại lệ: thư viện viết bằng C như NumPy nhả GIL trong lúc tính, nên phần tính đó chạy song song thật (SL 86, chú thích).</text>
</svg>
