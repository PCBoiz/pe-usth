<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t06-title t06-desc">
<title id="t06-title">Queue và worker: hàng đợi an toàn giữa các thread</title>
<desc id="t06-desc">Luồng chính đẩy việc vào queue.Queue bằng put(), hàng đợi FIFO giữ các việc chờ, hai worker thread lặp mãi lấy việc bằng get(), xử lý rồi gọi task_done(); q.join() giữ luồng chính lại cho tới khi số task_done bằng số put. Vòng lặp 10,7 giây, 8 bước giữ 1,2 giây mỗi bước theo thứ tự: producer đẩy việc, việc vào hàng đợi, hàng đợi chờ, worker 1 lấy việc, worker 1 xử lý, worker 1 báo xong, worker 2 chạy độc lập, q.join trả về.</desc>
<defs>
<marker id="t06ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="#79d3ec"/>
</marker>
<marker id="t06arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="#5b6886"/>
</marker>
</defs>
<style>
  text{fill:#e8edf7;font-family:'Segoe UI',system-ui,sans-serif}
  .mono{font-family:Consolas,'Cascadia Mono','Courier New',monospace}
  .h1{font-size:25px;font-weight:600}
  .sub{font-size:14px;fill:#93a0bc}
  .ph{font-size:13px;font-weight:600}
  .cap{font-size:11.5px;fill:#5b6886}
  .bd{font-size:13px;fill:#93a0bc}
  /* Nhịp đã chia cho 1,5 so với bản đầu — tester xem bản live nói chậm quá. Vì thế thời lượng
     và delay là số lẻ (làm tròn 2 chữ số). Mốc % trong @keyframes KHÔNG đổi (đó là tỉ lệ),
     còn delay chia cùng hệ số để các lớp hình không lệch pha. */
  .ring{fill:none;stroke-width:2.5;opacity:0;animation:pulse 10.67s linear infinite}
  @keyframes pulse{0%{opacity:0}0.5%{opacity:1}11.5%{opacity:1}12.2%{opacity:0}100%{opacity:0}}
  .s1{animation-delay:0s}.s2{animation-delay:1.33s}.s3{animation-delay:2.67s}.s4{animation-delay:4s}
  .s5{animation-delay:5.33s}.s6{animation-delay:6.67s}.s7{animation-delay:8s}.s8{animation-delay:9.33s}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="1280" height="640" fill="#0f1626"/>

<text class="h1" x="40" y="50">Queue và worker: chia việc an toàn giữa các thread</text>
<text class="sub" x="40" y="78">queue.Queue đã tự khoá bên trong, nên nhiều thread put() và get() cùng lúc vẫn an toàn — không cần tự viết Lock như ở T05.</text>

<!-- ===== PRODUCER ===== -->
<rect x="40" y="112" width="270" height="240" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="56" y="140" fill="#9cc6ff">Luồng chính (producer)</text>
<text class="mono" x="56" y="178" font-size="12" fill="#e8edf7">for i in range(1, 7):</text>
<text class="mono" x="56" y="200" font-size="12" fill="#9cc6ff" xml:space="preserve">    q.put(f"việc {i}")</text>
<text class="bd" x="56" y="238">Đẩy việc vào hàng đợi</text>
<text class="bd" x="56" y="258">rồi đi tiếp — put() không chờ.</text>
<rect x="56" y="282" width="52" height="32" rx="5" fill="#1b2a47" stroke="#4c9bff"/>
<text x="82" y="303" font-size="12" text-anchor="middle" fill="#9cc6ff">#4</text>
<rect x="116" y="282" width="52" height="32" rx="5" fill="#1b2a47" stroke="#4c9bff"/>
<text x="142" y="303" font-size="12" text-anchor="middle" fill="#9cc6ff">#5</text>
<rect x="176" y="282" width="52" height="32" rx="5" fill="#1b2a47" stroke="#4c9bff"/>
<text x="202" y="303" font-size="12" text-anchor="middle" fill="#9cc6ff">#6</text>
<text class="cap" x="56" y="334">việc chưa đẩy vào</text>
<rect class="ring s1" x="48" y="160" width="254" height="56" rx="6" stroke="#4c9bff"/>

<!-- ===== QUEUE ===== -->
<rect x="370" y="112" width="330" height="240" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="390" y="140" fill="#79d3ec">queue.Queue()</text>
<text class="cap" x="390" y="162">FIFO · vào bên trái, ra bên phải · đã khoá sẵn bên trong</text>
<text class="cap" x="390" y="192" fill="#79d3ec">vào (put)</text>
<text class="cap" x="680" y="192" text-anchor="end" fill="#79d3ec">ra (get)</text>

<rect x="390" y="200" width="50" height="56" rx="6" fill="#121a2d" stroke="#2c3a5c" stroke-dasharray="4 4"/>
<rect x="450" y="200" width="50" height="56" rx="6" fill="#121a2d" stroke="#2c3a5c" stroke-dasharray="4 4"/>
<rect x="510" y="200" width="50" height="56" rx="6" fill="#16303a" stroke="#79d3ec"/>
<text x="535" y="234" font-size="13" text-anchor="middle" fill="#79d3ec">#3</text>
<rect x="570" y="200" width="50" height="56" rx="6" fill="#16303a" stroke="#79d3ec"/>
<text x="595" y="234" font-size="13" text-anchor="middle" fill="#79d3ec">#2</text>
<rect x="630" y="200" width="50" height="56" rx="6" fill="#16303a" stroke="#79d3ec"/>
<text x="655" y="234" font-size="13" text-anchor="middle" fill="#79d3ec">#1</text>
<text class="cap" x="415" y="278" text-anchor="middle">chỗ trống</text>
<text class="cap" x="655" y="278" text-anchor="middle" fill="#79d3ec">#1 ra trước</text>
<text class="bd" x="390" y="312">get() tự chờ nếu hàng đợi rỗng —</text>
<text class="bd" x="390" y="332">không phải viết vòng lặp bận.</text>
<rect class="ring s2" x="386" y="196" width="58" height="64" rx="7" stroke="#79d3ec"/>
<rect class="ring s3" x="506" y="196" width="178" height="64" rx="7" stroke="#79d3ec"/>

<!-- mui ten put / get -->
<line x1="312" y1="228" x2="366" y2="228" stroke="#79d3ec" stroke-width="1.8" marker-end="url(#t06ar)"/>
<text class="cap" x="339" y="216" text-anchor="middle" fill="#79d3ec">put()</text>
<rect class="ring s2" x="312" y="221" width="54" height="14" rx="7" stroke="#79d3ec"/>
<line x1="702" y1="228" x2="756" y2="228" stroke="#79d3ec" stroke-width="1.8" marker-end="url(#t06ar)"/>
<text class="cap" x="729" y="216" text-anchor="middle" fill="#79d3ec">get()</text>
<rect class="ring s4" x="702" y="221" width="54" height="14" rx="7" stroke="#79d3ec"/>

<!-- ===== WORKER 1 ===== -->
<rect x="760" y="112" width="228" height="240" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="874" y="140" text-anchor="middle" fill="#f4a274">Worker 1 (thread)</text>
<rect x="774" y="160" width="200" height="40" rx="6" fill="#2a2119" stroke="#f4a274"/>
<text class="mono" x="788" y="185" font-size="12" fill="#f4a274">viec = q.get()</text>
<rect x="774" y="208" width="200" height="40" rx="6" fill="#1d2740" stroke="#2c3a5c"/>
<text x="788" y="233" font-size="12.5" fill="#e8edf7">xử lý việc</text>
<rect x="774" y="256" width="200" height="40" rx="6" fill="#2a2119" stroke="#f4a274"/>
<text class="mono" x="788" y="281" font-size="12" fill="#f4a274">q.task_done()</text>
<path d="M774 276 H 768 V 180 H 770" fill="none" stroke="#5b6886" stroke-width="1.5" marker-end="url(#t06arg)"/>
<text class="cap" x="874" y="324" text-anchor="middle">while True — lặp mãi</text>
<rect class="ring s4" x="770" y="156" width="208" height="48" rx="7" stroke="#f4a274"/>
<rect class="ring s5" x="770" y="204" width="208" height="48" rx="7" stroke="#f4a274"/>
<rect class="ring s6" x="762" y="252" width="216" height="48" rx="7" stroke="#f4a274"/>

<!-- ===== WORKER 2 ===== -->
<rect x="1012" y="112" width="228" height="240" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="1126" y="140" text-anchor="middle" fill="#c9a2ff">Worker 2 (thread)</text>
<rect x="1026" y="160" width="200" height="40" rx="6" fill="#231c3a" stroke="#c9a2ff"/>
<text class="mono" x="1040" y="185" font-size="12" fill="#c9a2ff">viec = q.get()</text>
<rect x="1026" y="208" width="200" height="40" rx="6" fill="#1d2740" stroke="#2c3a5c"/>
<text x="1040" y="233" font-size="12.5" fill="#e8edf7">xử lý việc</text>
<rect x="1026" y="256" width="200" height="40" rx="6" fill="#231c3a" stroke="#c9a2ff"/>
<text class="mono" x="1040" y="281" font-size="12" fill="#c9a2ff">q.task_done()</text>
<path d="M1026 276 H 1020 V 180 H 1022" fill="none" stroke="#5b6886" stroke-width="1.5" marker-end="url(#t06arg)"/>
<text class="cap" x="1126" y="324" text-anchor="middle">chạy độc lập với Worker 1</text>
<rect class="ring s7" x="1016" y="156" width="216" height="144" rx="7" stroke="#c9a2ff"/>

<!-- ===== JOIN ===== -->
<line x1="874" y1="354" x2="874" y2="374" stroke="#9fd88f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#t06arg)"/>
<line x1="1126" y1="354" x2="1126" y2="374" stroke="#9fd88f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#t06arg)"/>
<rect x="40" y="376" width="1200" height="66" rx="10" fill="#15251c" stroke="#9fd88f"/>
<text class="mono" x="60" y="405" font-size="15" fill="#9fd88f">q.join()</text>
<text class="bd" x="150" y="405" fill="#9fd88f">luồng chính đứng chờ ở đây cho tới khi SỐ LẦN task_done() bằng đúng SỐ LẦN put().</text>
<text class="cap" x="60" y="428">Thiếu một task_done() thì join() treo mãi; gọi thừa thì ValueError. Mỗi mũi tên đứt trên kia là một lần đếm lên.</text>
<rect class="ring s8" x="44" y="380" width="1192" height="58" rx="8" stroke="#9fd88f"/>

<!-- ===== MA NGUON ===== -->
<rect x="40" y="456" width="1200" height="144" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="60" y="480">Mã nguồn</text>
<text class="cap" x="1220" y="480" text-anchor="end">tài liệu Python: queue · threading</text>
<text class="mono" x="60" y="506" font-size="12.5" fill="#e8edf7">q = queue.Queue()</text>
<text class="mono" x="60" y="528" font-size="12.5" fill="#e8edf7">for i in range(1, 7):</text>
<text class="mono" x="60" y="550" font-size="12.5" fill="#9cc6ff" xml:space="preserve">    q.put(f"việc {i}")</text>
<text class="mono" x="60" y="572" font-size="12.5" fill="#e8edf7">for _ in range(2):</text>
<text class="mono" x="60" y="594" font-size="12.5" fill="#e8edf7" xml:space="preserve">    threading.Thread(target=worker, daemon=True).start()</text>
<line x1="640" y1="492" x2="640" y2="584" stroke="#273352"/>
<text class="mono" x="672" y="506" font-size="12.5" fill="#e8edf7">def worker():</text>
<text class="mono" x="672" y="528" font-size="12.5" fill="#e8edf7" xml:space="preserve">    while True:</text>
<text class="mono" x="672" y="550" font-size="12.5" fill="#f4a274" xml:space="preserve">        viec = q.get()</text>
<text class="mono" x="672" y="572" font-size="12.5" fill="#e8edf7" xml:space="preserve">        xu_ly(viec)</text>
<text class="mono" x="672" y="594" font-size="12.5" fill="#f4a274" xml:space="preserve">        q.task_done()</text>
<text class="cap" x="1000" y="550">chờ sẵn nếu rỗng</text>
<text class="cap" x="1000" y="594">báo xong một việc</text>

<text class="cap" x="40" y="628">Nguồn: tài liệu chính thức Python (queue.Queue, task_done, join). Slide USTH 103-105 chỉ nói tới threading.Lock, chưa nói tới Queue.</text>
</svg>
