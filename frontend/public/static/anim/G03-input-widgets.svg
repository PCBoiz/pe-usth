<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="g03-title g03-desc">
<title id="g03-title">Widget nhập liệu và cách đọc giá trị</title>
<desc id="g03-desc">Vòng lặp 15 giây, 5 bước giữ mỗi bước 3 giây, theo thứ tự đọc từ trên xuống: Entry, Checkbutton, cặp Radiobutton cùng trỏ vào MỘT StringVar, Listbox, Combobox; mỗi bước nối widget trong cửa sổ với biến liên kết và câu lệnh .get() tương ứng. Khi tắt hoạt hình, hình đứng ở trạng thái đầy đủ: mọi widget, mọi biến và mọi lệnh đọc đều hiện.</desc>
<style>
  text{font-family:'Segoe UI',system-ui,sans-serif;fill:#e8edf7}
  .t{font-size:27px;font-weight:600}
  .sub{font-size:15px;fill:#93a0bc}
  .eye{font-size:13px;font-weight:600;letter-spacing:.6px}
  .h{font-size:15px;font-weight:600}
  .sm{font-size:13px;fill:#93a0bc}
  .dim{font-size:12px;fill:#5b6886}
  .m{font-family:Consolas,'Cascadia Mono','Courier New',monospace;font-size:13px;fill:#e8edf7}
  .ms{font-family:Consolas,'Cascadia Mono','Courier New',monospace;font-size:12px;fill:#93a0bc}
  .panel{fill:#162036;stroke:#273352;stroke-width:1.5}
  .card{fill:#1a2440;stroke:#2f3d60;stroke-width:1.4}
  .win{fill:#10192c;stroke:#273352;stroke-width:1.6}
  .bar{fill:#1d2a46}
  .field{fill:#101a2e;stroke:#3d4a6e;stroke-width:1.3}
  .wire{fill:none;stroke:#4a5a80;stroke-width:1.5}
  .glow{fill:none;stroke-width:2.6;opacity:0}

  /* Bật tức thời rồi GIỮ 3s mỗi chặng — hoạt hình chỉ dẫn mắt theo thứ tự đọc. */
  .s1{animation:k1 15s linear infinite}
  .s2{animation:k2 15s linear infinite}
  .s3{animation:k3 15s linear infinite}
  .s4{animation:k4 15s linear infinite}
  .s5{animation:k5 15s linear infinite}
  @keyframes k1{0%,19.5%{opacity:1}20%,100%{opacity:0}}
  @keyframes k2{0%,19.5%{opacity:0}20%,39.5%{opacity:1}40%,100%{opacity:0}}
  @keyframes k3{0%,39.5%{opacity:0}40%,59.5%{opacity:1}60%,100%{opacity:0}}
  @keyframes k4{0%,59.5%{opacity:0}60%,79.5%{opacity:1}80%,100%{opacity:0}}
  @keyframes k5{0%,79.5%{opacity:0}80%,100%{opacity:1}}

  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>

<rect width="1280" height="640" fill="#0f1626"/>
<defs>
  <marker id="g03-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4a5a80"/></marker>
</defs>

<text class="t" x="48" y="54">Widget nhập liệu: biến liên kết và <tspan fill="#9fd88f">.get()</tspan></text>
<text class="sub" x="48" y="80">Widget chỉ hiển thị. Giá trị nằm ở BIẾN (StringVar / IntVar) hoặc đọc thẳng từ widget.</text>

<!-- ===================== cửa sổ mẫu ===================== -->
<rect class="win" x="48" y="112" width="472" height="408" rx="10"/>
<path class="bar" d="M48,122 a10,10 0 0 1 10,-10 h452 a10,10 0 0 1 10,10 v26 h-472 z"/>
<circle cx="70" cy="131" r="5.5" fill="#f4a274"/><circle cx="88" cy="131" r="5.5" fill="#f5b83d"/><circle cx="106" cy="131" r="5.5" fill="#9fd88f"/>
<text class="ms" x="284" y="136" text-anchor="middle" fill="#e8edf7">Tkinter widgets</text>

<!-- Entry -->
<rect class="field" x="72" y="172" width="424" height="34" rx="5"/>
<text class="m" x="86" y="194">Nguyễn An</text>
<text class="dim" x="496" y="167" text-anchor="end">Entry</text>

<!-- Checkbutton -->
<rect x="76" y="232" width="16" height="16" rx="3" fill="#1a2440" stroke="#4c9bff" stroke-width="1.6"/>
<path d="M79.5,240 L83,243.5 L89,236" fill="none" stroke="#4c9bff" stroke-width="2"/>
<text class="sm" x="102" y="245" fill="#e8edf7">Nhận thông báo</text>
<text class="dim" x="496" y="245" text-anchor="end">Checkbutton</text>

<!-- Radiobutton -->
<circle cx="84" cy="284" r="8" fill="none" stroke="#c9a2ff" stroke-width="1.6"/>
<circle cx="84" cy="284" r="4" fill="#c9a2ff"/>
<text class="sm" x="102" y="289" fill="#e8edf7">Khoá ICT</text>
<text class="ms" x="496" y="289" text-anchor="end">value="ict"</text>
<circle cx="84" cy="316" r="8" fill="none" stroke="#5b6886" stroke-width="1.6"/>
<text class="sm" x="102" y="321" fill="#93a0bc">Khoá SPACE</text>
<text class="ms" x="496" y="321" text-anchor="end">value="space"</text>

<!-- Listbox -->
<rect class="field" x="72" y="346" width="424" height="108" rx="5"/>
<rect x="74" y="348" width="420" height="24" fill="#243352"/>
<text class="m" x="86" y="365" fill="#79d3ec">ICT</text>
<text class="m" x="86" y="389">I See Tea</text>
<text class="m" x="86" y="413">Icy Tea</text>
<text class="m" x="86" y="437">Ice City</text>
<text class="dim" x="496" y="340" text-anchor="end">Listbox</text>

<!-- Combobox -->
<rect class="field" x="72" y="464" width="424" height="34" rx="5"/>
<rect x="462" y="465" width="33" height="32" rx="4" fill="#243352"/>
<path d="M472,479 L478.5,486 L485,479" fill="none" stroke="#79d3ec" stroke-width="1.8"/>
<text class="m" x="86" y="486">ICT</text>
<text class="dim" x="440" y="511" text-anchor="end">Combobox (ttk)</text>

<!-- ===================== dây nối ===================== -->
<line class="wire" x1="524" y1="189" x2="616" y2="189" marker-end="url(#g03-a)"/>
<path class="wire" d="M524,240 H570 V261 H616" marker-end="url(#g03-a)"/>
<path class="wire" d="M524,284 H584 V343 H616" marker-end="url(#g03-a)"/>
<path class="wire" d="M524,316 H584 V343" />
<path class="wire" d="M524,400 H570 V425 H616" marker-end="url(#g03-a)"/>
<path class="wire" d="M524,481 H570 V495 H616" marker-end="url(#g03-a)"/>

<!-- ===================== thẻ biến + cách đọc ===================== -->
<rect class="card" x="620" y="160" width="612" height="62" rx="8"/>
<text class="h" x="636" y="186" fill="#79d3ec">Entry</text>
<text class="m" x="748" y="186">textvariable=name_var  <tspan fill="#5b6886"># tk.StringVar()</tspan></text>
<text class="m" x="748" y="208" fill="#9fd88f">name_var.get()  →  "Nguyễn An"</text>

<rect class="card" x="620" y="230" width="612" height="62" rx="8"/>
<text class="h" x="636" y="256" fill="#4c9bff">Checkbutton</text>
<text class="m" x="748" y="256">variable=notify_var  <tspan fill="#5b6886"># tk.IntVar()</tspan></text>
<text class="m" x="748" y="278" fill="#9fd88f">notify_var.get()  →  1  <tspan fill="#5b6886">(chưa tick: 0)</tspan></text>

<rect class="card" x="620" y="300" width="612" height="86" rx="8" stroke="#c9a2ff"/>
<text class="h" x="636" y="326" fill="#c9a2ff">Radiobutton</text>
<text class="ms" x="636" y="346">hai nút</text>
<text class="m" x="748" y="326">variable=course_var  <tspan fill="#f5b83d"># MỘT StringVar dùng CHUNG</tspan></text>
<text class="m" x="748" y="348">mỗi nút một value khác nhau → chọn nút nào, biến mang value đó</text>
<text class="m" x="748" y="370" fill="#9fd88f">course_var.get()  →  "ict"</text>

<rect class="card" x="620" y="394" width="612" height="62" rx="8"/>
<text class="h" x="636" y="420" fill="#f4a274">Listbox</text>
<text class="m" x="748" y="420">không gắn biến  <tspan fill="#5b6886"># đọc thẳng từ widget</tspan></text>
<text class="m" x="748" y="442" fill="#9fd88f">listbox.get(tk.ACTIVE)  →  "ICT"</text>

<rect class="card" x="620" y="464" width="612" height="62" rx="8"/>
<text class="h" x="636" y="490" fill="#f5b83d">Combobox</text>
<text class="m" x="748" y="490">ttk.Combobox(window, values=icts)</text>
<text class="m" x="748" y="512" fill="#9fd88f">combobox.get()  →  "ICT"</text>

<!-- ===================== ghi chú ===================== -->
<rect class="panel" x="48" y="544" width="1184" height="60" rx="10"/>
<text class="sm" x="72" y="570" fill="#e8edf7">Quy tắc chung: <tspan fill="#93a0bc">widget lo phần hiển thị, BIẾN giữ giá trị. Đọc bằng .get() — đừng cố đọc chữ đang vẽ trên màn hình.</tspan></text>
<text class="ms" x="72" y="592">Entry cũng có entry.get(); nhưng gắn textvariable thì đặt giá trị ban đầu và xoá trắng dễ hơn: name_var.set("")</text>

<!-- ===================== nhấn theo bước ===================== -->
<rect class="glow s1" x="66" y="166" width="436" height="46" rx="8" stroke="#79d3ec"/>
<rect class="glow s1" x="616" y="156" width="620" height="70" rx="10" stroke="#79d3ec"/>
<rect class="glow s2" x="66" y="222" width="436" height="36" rx="8" stroke="#4c9bff"/>
<rect class="glow s2" x="616" y="226" width="620" height="70" rx="10" stroke="#4c9bff"/>
<rect class="glow s3" x="66" y="266" width="436" height="68" rx="8" stroke="#c9a2ff"/>
<rect class="glow s3" x="616" y="296" width="620" height="94" rx="10" stroke="#c9a2ff"/>
<path class="glow s3" d="M524,284 H584 V343 H612" stroke="#c9a2ff" stroke-width="3"/>
<path class="glow s3" d="M524,316 H584" stroke="#c9a2ff" stroke-width="3"/>
<rect class="glow s4" x="66" y="340" width="436" height="120" rx="8" stroke="#f4a274"/>
<rect class="glow s4" x="616" y="390" width="620" height="70" rx="10" stroke="#f4a274"/>
<rect class="glow s5" x="66" y="458" width="436" height="46" rx="8" stroke="#f5b83d"/>
<rect class="glow s5" x="616" y="460" width="620" height="70" rx="10" stroke="#f5b83d"/>
</svg>
