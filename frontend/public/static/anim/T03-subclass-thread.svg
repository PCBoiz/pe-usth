<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t03-title t03-desc">
<title id="t03-title">Kế thừa Thread: __init__ ở luồng chính, run() ở luồng con</title>
<desc id="t03-desc">Bên trái là lớp Worker kế thừa threading.Thread với __init__ gọi super().__init__() và run() chứa thân việc, cùng dải 5 bước dùng thread. Bên phải là hai làn: luồng chính tạo đối tượng rồi gọi start(), luồng con mới chạy run(); gọi run() trực tiếp thì không có luồng nào được tạo. Vòng lặp 10,7 giây, 8 bước giữ 1,2 giây mỗi bước, thứ tự: khối __init__, khối run, tạo đối tượng, gọi start, luồng con vào run, thân run chạy, luồng con kết thúc và join trả về, cảnh báo start khác run.</desc>
<defs>
<pattern id="t03hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#1c2540"/>
  <line x1="0" y1="0" x2="0" y2="8" stroke="#3a4a74" stroke-width="3"/>
</pattern>
<marker id="t03ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="#93a0bc"/>
</marker>
</defs>
<style>
  text{fill:#e8edf7;font-family:'Segoe UI',system-ui,sans-serif}
  .mono{font-family:Consolas,'Cascadia Mono','Courier New',monospace}
  .h1{font-size:25px;font-weight:600}
  .sub{font-size:14px;fill:#93a0bc}
  .ph{font-size:16px;font-weight:600}
  .cap{font-size:12px;fill:#5b6886}
  .bd{font-size:13px;fill:#93a0bc}
  /* Nhịp đã chia cho 1,5 so với bản đầu — tester xem bản live nói chậm quá. Vì thế thời lượng
     và delay là số lẻ (làm tròn 2 chữ số). Mốc % trong @keyframes KHÔNG đổi (đó là tỉ lệ),
     còn delay chia cùng hệ số để các lớp hình không lệch pha. */
  .ring{fill:none;stroke-width:2.5;opacity:0;animation:pulse 10.67s linear infinite}
  @keyframes pulse{0%{opacity:0}0.5%{opacity:1}11.5%{opacity:1}12.2%{opacity:0}100%{opacity:0}}
  .s1{animation-delay:0s}.s2{animation-delay:1.33s}.s3{animation-delay:2.67s}.s4{animation-delay:4s}
  .s5{animation-delay:5.33s}.s6{animation-delay:6.67s}.s7{animation-delay:8s}.s8{animation-delay:9.33s}
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="1280" height="640" fill="#0f1626"/>

<text class="h1" x="40" y="50">Kế thừa Thread: viết run(), nhưng gọi start()</text>
<text class="sub" x="40" y="78">__init__ chạy trong luồng chính lúc tạo đối tượng. Chỉ có start() mới mở luồng con, và chính luồng con đó gọi run() hộ bạn.</text>

<!-- ===== MA NGUON ===== -->
<rect x="40" y="100" width="580" height="330" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="60" y="130">Lớp con của threading.Thread</text>
<text class="cap" x="600" y="130" text-anchor="end">SL 97, 102</text>

<text class="mono" x="60" y="162" font-size="13.5" fill="#9cc6ff">import threading, time</text>
<text class="mono" x="60" y="212" font-size="13.5" fill="#e8edf7">class Worker(threading.Thread):</text>
<text class="mono" x="60" y="237" font-size="13.5" fill="#e8edf7" xml:space="preserve">    def __init__(self, sleepTime):</text>
<text class="mono" x="60" y="262" font-size="13.5" fill="#f5b83d" xml:space="preserve">        super().__init__()</text>
<text class="mono" x="60" y="287" font-size="13.5" fill="#e8edf7" xml:space="preserve">        self.sleepTime = sleepTime</text>
<text class="mono" x="60" y="337" font-size="13.5" fill="#f4a274" xml:space="preserve">    def run(self):</text>
<text class="mono" x="60" y="362" font-size="13.5" fill="#e8edf7" xml:space="preserve">        time.sleep(self.sleepTime)</text>
<text class="mono" x="60" y="387" font-size="13.5" fill="#e8edf7" xml:space="preserve">        print("Finished sleeping")</text>
<text class="cap" x="330" y="262">bắt buộc, gọi trước</text>
<text class="cap" x="230" y="337">thân của luồng con</text>

<rect class="ring s1" x="52" y="219" width="556" height="75" rx="5" stroke="#f5b83d"/>
<rect class="ring s2" x="52" y="319" width="556" height="75" rx="5" stroke="#f4a274"/>

<!-- ===== 5 BUOC ===== -->
<rect x="40" y="450" width="580" height="110" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="60" y="478">5 bước dùng thread</text>
<text class="cap" x="600" y="478" text-anchor="end">SL 95</text>
<rect x="60" y="496" width="100" height="42" rx="6" fill="#16233c" stroke="#30406a"/>
<text x="110" y="522" font-size="11.5" text-anchor="middle" fill="#93a0bc">1 · import</text>
<rect x="168" y="496" width="100" height="42" rx="6" fill="#16233c" stroke="#30406a"/>
<text x="218" y="522" font-size="11.5" text-anchor="middle" fill="#93a0bc">2 · lớp con</text>
<rect x="276" y="496" width="100" height="42" rx="6" fill="#16233c" stroke="#30406a"/>
<text x="326" y="522" font-size="11.5" text-anchor="middle" fill="#93a0bc">3 · tạo instance</text>
<rect x="384" y="496" width="100" height="42" rx="6" fill="#1b2a47" stroke="#4c9bff"/>
<text x="434" y="522" font-size="11.5" text-anchor="middle" fill="#9cc6ff">4 · .start()</text>
<rect x="492" y="496" width="100" height="42" rx="6" fill="#2a2119" stroke="#f5b83d"/>
<text x="542" y="522" font-size="11.5" text-anchor="middle" fill="#f5b83d">5 · .join()</text>

<!-- ===== HAI LAN ===== -->
<rect x="644" y="100" width="596" height="460" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="664" y="130">run() chạy ở đâu?</text>

<rect x="664" y="146" width="250" height="324" rx="8" fill="#141d33" stroke="#2c3a5c"/>
<text x="789" y="170" font-size="13" font-weight="600" text-anchor="middle" fill="#9cc6ff">Luồng chính (main)</text>
<rect x="1004" y="146" width="216" height="324" rx="8" fill="#141d33" stroke="#2c3a5c"/>
<text x="1112" y="170" font-size="13" font-weight="600" text-anchor="middle" fill="#f4a274">Luồng con</text>

<!-- A1 -->
<rect x="676" y="186" width="226" height="54" rx="6" fill="#1b2a47" stroke="#4c9bff"/>
<text class="mono" x="690" y="209" font-size="13" fill="#9cc6ff">w = Worker(2)</text>
<text x="690" y="229" font-size="11" fill="#93a0bc">__init__ chạy ở luồng chính</text>
<rect class="ring s3" x="680" y="190" width="218" height="46" rx="5" stroke="#4c9bff"/>
<!-- A2 -->
<rect x="676" y="252" width="226" height="54" rx="6" fill="#1b2a47" stroke="#4c9bff"/>
<text class="mono" x="690" y="275" font-size="13" fill="#9cc6ff">w.start()</text>
<text x="690" y="295" font-size="11" fill="#93a0bc">trả về ngay, không chờ</text>
<rect class="ring s4" x="680" y="256" width="218" height="46" rx="5" stroke="#4c9bff"/>
<!-- A idle -->
<rect x="676" y="320" width="226" height="80" rx="6" fill="url(#t03hatch)" stroke="#2c3a5c"/>
<text x="789" y="365" font-size="12" text-anchor="middle" fill="#93a0bc">main làm việc khác</text>
<!-- A3 -->
<rect x="676" y="414" width="226" height="44" rx="6" fill="#2a2119" stroke="#f5b83d"/>
<text class="mono" x="690" y="436" font-size="13" fill="#f5b83d">w.join()</text>
<text x="780" y="436" font-size="11" fill="#93a0bc">→ trả về khi con xong</text>
<rect class="ring s7" x="680" y="418" width="218" height="36" rx="5" stroke="#f5b83d"/>

<!-- B1..B4 -->
<rect x="1016" y="252" width="192" height="54" rx="6" fill="#2a2119" stroke="#f4a274"/>
<text class="mono" x="1030" y="275" font-size="13" fill="#f4a274">run(self)</text>
<text x="1030" y="295" font-size="11" fill="#93a0bc">Python gọi hộ, ta không gọi</text>
<rect class="ring s5" x="1020" y="256" width="184" height="46" rx="5" stroke="#f4a274"/>
<rect x="1016" y="320" width="192" height="36" rx="6" fill="#1d2740" stroke="#2c3a5c"/>
<text class="mono" x="1030" y="343" font-size="12.5" fill="#e8edf7">time.sleep(2)</text>
<rect x="1016" y="364" width="192" height="36" rx="6" fill="#1d2740" stroke="#2c3a5c"/>
<text class="mono" x="1030" y="387" font-size="12.5" fill="#e8edf7">print("...")</text>
<rect class="ring s6" x="1020" y="324" width="184" height="72" rx="5" stroke="#f4a274"/>
<rect x="1016" y="414" width="192" height="44" rx="6" fill="#1a2b22" stroke="#9fd88f"/>
<text x="1112" y="441" font-size="12" text-anchor="middle" fill="#9fd88f">luồng con kết thúc</text>
<rect class="ring s7" x="1020" y="418" width="184" height="36" rx="5" stroke="#9fd88f"/>

<!-- mui ten -->
<line x1="906" y1="279" x2="1012" y2="279" stroke="#f4a274" stroke-width="1.8" marker-end="url(#t03ar)"/>
<text x="959" y="268" font-size="11" text-anchor="middle" fill="#f4a274">start()</text>
<rect class="ring s5" x="906" y="272" width="106" height="14" rx="7" stroke="#f4a274"/>
<line x1="1012" y1="436" x2="908" y2="436" stroke="#9fd88f" stroke-width="1.8" marker-end="url(#t03ar)"/>
<text x="960" y="425" font-size="11" text-anchor="middle" fill="#9fd88f">xong</text>
<rect class="ring s7" x="908" y="429" width="104" height="14" rx="7" stroke="#9fd88f"/>

<!-- canh bao -->
<rect x="664" y="486" width="556" height="58" rx="8" fill="#241a1a" stroke="#f5b83d"/>
<text class="bd" x="680" y="510" fill="#f5b83d">Gọi w.run() thì KHÔNG có luồng mới: run() chạy ngay trong luồng chính,</text>
<text class="bd" x="680" y="531" fill="#f5b83d">tuần tự như một hàm thường — và join() sau đó chẳng chờ ai.</text>
<rect class="ring s8" x="668" y="490" width="548" height="50" rx="7" stroke="#f5b83d"/>

<text class="cap" x="40" y="604">Nguồn: slide USTH 95, 97, 99-102. Truyền tham số thì đặt vào __init__; đừng truyền vào start() — start() không nhận đối số.</text>
</svg>
