<rect class="glow s3" x="884" y="126" width="352" height="208" rx="10" stroke="#f4a274"/>
<rect class="glow s4" x="402" y="302" width="420" height="24" rx="6" stroke="#9fd88f"/>
<line class="glow s4" x1="690" y1="334" x2="690" y2="394" stroke="#9fd88f" stroke-width="3.4"/>
