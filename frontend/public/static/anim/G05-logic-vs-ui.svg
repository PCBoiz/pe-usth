<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="g05-title g05-desc">
<title id="g05-title">Tách lõi thuần khỏi lớp giao diện</title>
<desc id="g05-desc">Vòng lặp 10 giây, 5 bước giữ mỗi bước 2 giây: (1) người dùng gõ điểm rồi bấm Thêm điểm; (2) callback add_mark gọi xuống hàm thuần validate_mark; (3) chuỗi sai thì ValueError bật ngược lên và lớp giao diện mở messagebox; (4) hợp lệ thì gọi summary(marks) lấy chuỗi tóm tắt; (5) Label đổi chữ. Dải dưới cho thấy chính hai hàm thuần đó chạy thẳng trong pytest, không cần mở cửa sổ. Khi tắt hoạt hình, hình đứng ở trạng thái đầy đủ.</desc>
<style>
  text{font-family:'Segoe UI',system-ui,sans-serif;fill:#e8edf7}
  .t{font-size:27px;font-weight:600}
  .sub{font-size:15px;fill:#93a0bc}
  .eye{font-size:13px;font-weight:600;letter-spacing:.6px}
  .h{font-size:15px;font-weight:600}
  .sm{font-size:13px;fill:#93a0bc}
  .dim{font-size:12px;fill:#5b6886}
  .mc{font-family:Consolas,'Cascadia Mono','Courier New',monospace;font-size:11.5px;fill:#e8edf7}
  .ms{font-family:Consolas,'Cascadia Mono','Courier New',monospace;font-size:11.5px;fill:#93a0bc}
  .panel{fill:#162036;stroke:#273352;stroke-width:1.5}
  .card{fill:#1a2440;stroke:#2f3d60;stroke-width:1.4}
  .win{fill:#10192c;stroke:#273352;stroke-width:1.5}
  .bar{fill:#1d2a46}
  .field{fill:#101a2e;stroke:#3d4a6e;stroke-width:1.2}
  .glow{fill:none;stroke-width:2.6;opacity:0}

  /* Bật tức thời, giữ 2s mỗi bước: mắt đi đúng đường mà lời gọi đi. */
  /* Nhịp đã chia cho 1,5 so với bản đầu — tester xem bản live nói chậm quá. Vì thế thời lượng
     và delay là số lẻ (làm tròn 2 chữ số). Mốc % trong @keyframes KHÔNG đổi (đó là tỉ lệ),
     còn delay chia cùng hệ số để các lớp hình không lệch pha. */
  .s1{animation:k1 10s linear infinite}.s2{animation:k2 10s linear infinite}
  .s3{animation:k3 10s linear infinite}.s4{animation:k4 10s linear infinite}
  .s5{animation:k5 10s linear infinite}
  @keyframes k1{0%,19.5%{opacity:1}20%,100%{opacity:0}}
  @keyframes k2{0%,19.5%{opacity:0}20%,39.5%{opacity:1}40%,100%{opacity:0}}
  @keyframes k3{0%,39.5%{opacity:0}40%,59.5%{opacity:1}60%,100%{opacity:0}}
  @keyframes k4{0%,59.5%{opacity:0}60%,79.5%{opacity:1}80%,100%{opacity:0}}
  @keyframes k5{0%,79.5%{opacity:0}80%,100%{opacity:1}}

  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>

<rect width="1280" height="640" fill="#0f1626"/>
<defs>
  <marker id="g05-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9fd88f"/></marker>
  <marker id="g05-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f4a274"/></marker>
  <marker id="g05-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#4c9bff"/></marker>
</defs>

<text class="t" x="48" y="54">Tách <tspan fill="#9fd88f">lõi thuần</tspan> khỏi <tspan fill="#4c9bff">lớp giao diện</tspan></text>
<text class="sub" x="48" y="80">Hàm thuần nhận chuỗi/số và trả chuỗi/số. Lớp giao diện chỉ lo widget, callback và messagebox.</text>

<!-- ===================== LỚP GIAO DIỆN ===================== -->
<text class="eye" x="48" y="118" fill="#4c9bff">LỚP GIAO DIỆN — biết widget, không biết luật điểm</text>

<rect class="win" x="48" y="130" width="288" height="200" rx="9"/>
<path class="bar" d="M48,139 a9,9 0 0 1 9,-9 h270 a9,9 0 0 1 9,9 v22 h-288 z"/>
<text class="ms" x="192" y="152" text-anchor="middle" fill="#e8edf7">Điểm trung bình</text>
<rect class="field" x="72" y="184" width="240" height="32" rx="5"/>
<text class="mc" x="84" y="205">8.5</text>
<text class="dim" x="312" y="180" text-anchor="end">Entry (mark_var)</text>
<rect x="104" y="232" width="176" height="34" rx="6" fill="#243352" stroke="#4c9bff" stroke-width="1.3"/>
<text class="mc" x="192" y="253" text-anchor="middle">Thêm điểm</text>
<rect x="72" y="282" width="240" height="30" rx="5" fill="#1a2440" stroke="#9fd88f" stroke-width="1.3"/>
<text class="mc" x="192" y="302" text-anchor="middle" fill="#9fd88f">2 điểm, trung bình 7.50</text>
<text class="dim" x="192" y="324" text-anchor="middle">Label (chữ do summary() sinh ra)</text>

<rect class="card" x="392" y="130" width="440" height="200" rx="8"/>
<text class="h" x="408" y="154" fill="#4c9bff">Callback — App.add_mark()</text>
<text class="mc" x="408" y="180">def add_mark(self):</text>
<text class="mc" x="408" y="199" xml:space="preserve">    try:</text>
<text class="mc" x="408" y="218" xml:space="preserve">        mark = <tspan fill="#9fd88f">validate_mark</tspan>(self.mark_var.get())</text>
<text class="mc" x="408" y="237" xml:space="preserve">    except ValueError as error:</text>
<text class="mc" x="408" y="256" xml:space="preserve">        <tspan fill="#f4a274">messagebox.showerror</tspan>("Điểm sai", str(error))</text>
<text class="mc" x="408" y="275" xml:space="preserve">        return</text>
<text class="mc" x="408" y="294" xml:space="preserve">    self.marks.append(mark)</text>
<text class="mc" x="408" y="313" xml:space="preserve">    self.result.config(text=<tspan fill="#9fd88f">summary</tspan>(self.marks))</text>

<rect class="card" x="888" y="130" width="344" height="200" rx="8" stroke="#f4a274"/>
<text class="h" x="904" y="154" fill="#f4a274">Báo lỗi cho người dùng</text>
<rect class="win" x="920" y="178" width="280" height="124" rx="8"/>
<path class="bar" d="M920,187 a9,9 0 0 1 9,-9 h262 a9,9 0 0 1 9,9 v22 h-280 z"/>
<text class="ms" x="1060" y="200" text-anchor="middle" fill="#e8edf7">Điểm sai</text>
<text class="mc" x="1060" y="236" text-anchor="middle" fill="#f4a274">Outside 0..10</text>
<rect x="1010" y="256" width="100" height="28" rx="5" fill="#243352" stroke="#4c9bff" stroke-width="1.2"/>
<text class="mc" x="1060" y="275" text-anchor="middle">OK</text>
<text class="dim" x="1060" y="320" text-anchor="middle">Chuỗi lỗi đến từ ValueError của hàm thuần</text>

<line x1="388" y1="240" x2="342" y2="240" stroke="#9fd88f" stroke-width="1.8" marker-end="url(#g05-g)"/>
<rect x="340" y="212" width="50" height="20" fill="#0f1626"/>
<text class="ms" x="365" y="227" text-anchor="middle" fill="#9fd88f">đổi chữ</text>
<line x1="836" y1="240" x2="884" y2="240" stroke="#f4a274" stroke-width="1.8" marker-end="url(#g05-o)"/>
<rect x="834" y="212" width="52" height="20" fill="#0f1626"/>
<text class="ms" x="860" y="227" text-anchor="middle" fill="#f4a274">lỗi</text>

<!-- ===================== RANH GIỚI ===================== -->
<line x1="48" y1="358" x2="1232" y2="358" stroke="#3d4a6e" stroke-width="1.4" stroke-dasharray="7 6"/>
<rect x="918" y="347" width="314" height="22" fill="#0f1626"/>
<text class="ms" x="1232" y="363" text-anchor="end" fill="#5b6886">ranh giới: dưới đây KHÔNG import tkinter</text>

<!-- mũi tên hai chiều xuyên ranh giới -->
<line x1="400" y1="334" x2="400" y2="394" stroke="#9fd88f" stroke-width="1.8" marker-start="url(#g05-g)" marker-end="url(#g05-g)"/>
<rect x="128" y="354" width="264" height="20" fill="#0f1626"/>
<text class="ms" x="390" y="369" text-anchor="end" fill="#9fd88f">validate_mark(raw) → float | ValueError</text>
<line x1="690" y1="334" x2="690" y2="394" stroke="#9fd88f" stroke-width="1.8" marker-start="url(#g05-g)" marker-end="url(#g05-g)"/>
<rect x="700" y="354" width="206" height="20" fill="#0f1626"/>
<text class="ms" x="700" y="369" fill="#9fd88f">summary(marks) → chuỗi</text>

<!-- ===================== LÕI THUẦN ===================== -->
<text class="eye" x="48" y="390" fill="#9fd88f">LÕI THUẦN — KIỂM THỬ ĐƯỢC</text>

<rect class="card" x="48" y="398" width="380" height="160" rx="8" stroke="#9fd88f"/>
<text class="mc" x="64" y="424">def validate_mark(raw):</text>
<text class="mc" x="64" y="443" xml:space="preserve">    mark = float(raw)</text>
<text class="mc" x="64" y="462" xml:space="preserve">    if not 0 &lt;= mark &lt;= 10:</text>
<text class="mc" x="64" y="481" xml:space="preserve">        raise ValueError(<tspan fill="#f4a274">"Outside 0..10"</tspan>)</text>
<text class="mc" x="64" y="500" xml:space="preserve">    return mark</text>
<text class="dim" x="64" y="534">Không đụng widget → gọi được từ bất kỳ đâu</text>

<rect class="card" x="452" y="398" width="380" height="160" rx="8" stroke="#9fd88f"/>
<text class="mc" x="468" y="424">def summary(marks):</text>
<text class="mc" x="468" y="443" xml:space="preserve">    if not marks:</text>
<text class="mc" x="468" y="462" xml:space="preserve">        return <tspan fill="#9fd88f">"Chưa có điểm"</tspan></text>
<text class="mc" x="468" y="481" xml:space="preserve">    average = sum(marks) / len(marks)</text>
<text class="mc" x="468" y="500" xml:space="preserve">    return (f"{len(marks)} điểm, "</text>
<text class="mc" x="468" y="519" xml:space="preserve">            f"trung bình {average:.2f}")</text>
<text class="dim" x="468" y="546">Trả CHUỖI; ai hiển thị chuỗi đó là việc của lớp trên</text>

<rect class="card" x="856" y="398" width="376" height="160" rx="8" stroke="#79d3ec"/>
<text class="ms" x="872" y="424" fill="#5b6886"># pytest — không mở cửa sổ nào</text>
<text class="mc" x="872" y="447">assert validate_mark("8") == 8.0</text>
<text class="mc" x="872" y="466">assert summary([]) == "Chưa có điểm"</text>
<text class="mc" x="872" y="485">with pytest.raises(ValueError):</text>
<text class="mc" x="872" y="504" xml:space="preserve">    validate_mark("11")</text>
<text class="dim" x="872" y="538">Trộn luật vào callback thì phải mở Tk mới test được</text>

<text class="sm" x="48" y="592">Vì sao tách: <tspan fill="#5b6886">đổi giao diện (thêm Combobox, chuyển sang web) không phải viết lại phép tính — và phép tính kiểm thử được bằng assert.</tspan></text>

