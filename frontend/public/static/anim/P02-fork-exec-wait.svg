<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="pfe-title pfe-desc">
  <title id="pfe-title">fork → exec → exit → wait</title>
  <desc id="pfe-desc">Vòng lặp 16 giây, 7 nhịp (mỗi nhịp 2 giây): 1 cha gọi fork(), 2 rẽ hai nhánh — cha nhận PID con, con nhận 0, 3 con gọi exec() nạp chương trình mới, 4 con exit(0), 5 mã thoát báo ngược lên cha, 6 wait() của cha trả về, 7 cha đọc exit code 0; rồi nghỉ 2 giây. Khung tĩnh đã hiện đủ hai làn cha/con, bốn lời gọi và mã thoát.</desc>
  <defs>
    <marker id="pfe-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#93a0bc"/>
    </marker>
    <marker id="pfe-arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fd88f"/>
    </marker>
  </defs>
  <style>
    text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:Consolas,'Cascadia Mono','Courier New',monospace}
    .h1{font-size:30px;fill:#e8edf7;font-weight:600}
    .sub{font-size:16px;fill:#93a0bc}
    .s{font-size:14px;fill:#93a0bc}
    .xs{font-size:12px;fill:#5b6886}
    .panel{fill:#162036;stroke:#273352;stroke-width:1.5}
    .lane{fill:#162036;stroke:#273352;stroke-width:1.5}
    .node{fill:#0f1626;stroke:#273352;stroke-width:1.5}
    .nm{font-size:17px;fill:#e8edf7;text-anchor:middle}
    .gl{font-size:12px;fill:#93a0bc;text-anchor:middle}
    .ev{font-size:12.5px;fill:#93a0bc}
    .ring{fill:none;stroke-width:2.5;opacity:0;animation:ring 16s linear infinite}
    @keyframes ring{0%{opacity:0}1%{opacity:1}11.5%{opacity:1}12.5%{opacity:0}100%{opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <rect width="1280" height="640" fill="#0f1626"/>
  <text class="h1" x="48" y="56">Tạo process trên UNIX: fork → exec → exit → wait</text>
  <text class="sub" x="48" y="86">Process mới không sinh ra từ hư không: fork() nhân bản process đang chạy, rồi exec() thay chương trình bên trong bản sao.</text>

  <!-- Làn -->
  <rect class="lane" x="260" y="160" width="972" height="140" rx="12"/>
  <rect class="lane" x="260" y="350" width="972" height="140" rx="12"/>
  <rect x="48" y="160" width="190" height="140" rx="12" fill="#4c9bff" fill-opacity="0.1" stroke="#4c9bff" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="s" x="70" y="222" fill="#4c9bff">Tiến trình CHA</text>
  <text class="xs" x="70" y="244">PID 2310 — vẫn sống</text>
  <text class="xs" x="70" y="262">suốt cả quá trình</text>
  <rect x="48" y="350" width="190" height="140" rx="12" fill="#9fd88f" fill-opacity="0.1" stroke="#9fd88f" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="s" x="70" y="412" fill="#9fd88f">Tiến trình CON</text>
  <text class="xs" x="70" y="434">PID 2378 — chỉ có</text>
  <text class="xs" x="70" y="452">sau khi fork()</text>

  <!-- Mũi tên (vẽ trước) -->
  <path d="M490,230 H754" fill="none" stroke="#93a0bc" stroke-width="2" marker-end="url(#pfe-ar)"/>
  <path d="M395,265 V369 Q395,377 403,377 H472 Q480,377 480,385 V399" fill="none" stroke="#93a0bc" stroke-width="2" marker-end="url(#pfe-ar)"/>
  <path d="M670,420 H814" fill="none" stroke="#93a0bc" stroke-width="2" marker-end="url(#pfe-ar)"/>
  <path d="M905,385 V277" fill="none" stroke="#9fd88f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#pfe-arg)"/>
  <path d="M950,230 H1014" fill="none" stroke="#93a0bc" stroke-width="2" marker-end="url(#pfe-ar)"/>

  <text class="ev" x="622" y="212" text-anchor="middle">cha: fork() trả về <tspan class="mono" fill="#4c9bff">2378</tspan> (PID con)</text>
  <text class="ev" x="412" y="318">con: fork() trả về <tspan class="mono" fill="#9fd88f">0</tspan></text>
  <text class="ev" x="917" y="326" fill="#9fd88f">mã thoát 0</text>
  <text class="xs" x="917" y="344">cha thu bằng wait()</text>

  <!-- Nút trên làn cha -->
  <rect class="node" x="300" y="195" width="190" height="70" rx="8"/>
  <text class="mono nm" x="395" y="225">fork()</text>
  <text class="gl" x="395" y="246">nhân bản process</text>

  <rect class="node" x="760" y="195" width="190" height="70" rx="8"/>
  <text class="mono nm" x="855" y="225">wait()</text>
  <text class="gl" x="855" y="246">cha dừng, chờ con</text>

  <rect x="1014" y="195" width="218" height="70" rx="8" fill="#4c9bff" fill-opacity="0.12" stroke="#4c9bff" stroke-opacity="0.5" stroke-width="1.5"/>
  <text xml:space="preserve" class="mono" x="1123" y="222" font-size="15" fill="#4c9bff" text-anchor="middle">returncode == 0</text>
  <text class="gl" x="1123" y="246">0 là xong êm, khác 0 là lỗi</text>

  <!-- Nút trên làn con -->
  <rect class="node" x="480" y="385" width="190" height="70" rx="8"/>
  <text class="mono nm" x="575" y="415">exec("ls")</text>
  <text class="gl" x="575" y="436">thay mã lệnh, giữ PID</text>

  <rect class="node" x="814" y="385" width="190" height="70" rx="8"/>
  <text class="mono nm" x="909" y="415">exit(0)</text>
  <text class="gl" x="909" y="436">con kết thúc</text>

  <!-- Đối chiếu Python -->
  <rect class="panel" x="48" y="514" width="760" height="86" rx="10"/>
  <text class="xs" x="70" y="538">Trong Python, subprocess làm cả fork lẫn exec giúp bạn:</text>
  <text xml:space="preserve" class="mono" x="70" y="562" font-size="13.5" fill="#e8edf7">p = subprocess.Popen(["ls", "-l"])   <tspan fill="#5b6886"># fork() + exec()</tspan></text>
  <text xml:space="preserve" class="mono" x="70" y="584" font-size="13.5" fill="#e8edf7">code = p.wait()                      <tspan fill="#5b6886"># cha chờ con, thu exit code</tspan></text>

  <rect class="panel" x="828" y="514" width="404" height="86" rx="10"/>
  <text class="xs" x="850" y="538">Dễ nhầm:</text>
  <text class="xs" x="850" y="560">fork() trả về HAI lần — một lần ở cha (PID con),</text>
  <text class="xs" x="850" y="578">một lần ở con (số 0). exec() thì không trả về.</text>

  <text class="xs" x="1232" y="622" text-anchor="end">Theo slide USTH 22–23</text>

  <!-- Nhấn theo nhịp -->
  <rect class="ring" x="296" y="191" width="198" height="78" rx="8" stroke="#93a0bc" style="animation-delay:0s"/>
  <path class="ring" d="M490,230 H752" stroke="#4c9bff" style="animation-delay:2s"/>
  <path class="ring" d="M395,265 V369 Q395,377 403,377 H472 Q480,377 480,385 V397" stroke="#9fd88f" style="animation-delay:2s"/>
  <rect class="ring" x="476" y="381" width="198" height="78" rx="8" stroke="#9fd88f" style="animation-delay:4s"/>
  <rect class="ring" x="810" y="381" width="198" height="78" rx="8" stroke="#9fd88f" style="animation-delay:6s"/>
  <path class="ring" d="M905,385 V279" stroke="#9fd88f" style="animation-delay:8s"/>
  <rect class="ring" x="756" y="191" width="198" height="78" rx="8" stroke="#4c9bff" style="animation-delay:10s"/>
  <rect class="ring" x="1010" y="191" width="226" height="78" rx="8" stroke="#4c9bff" style="animation-delay:12s"/>
</svg>
