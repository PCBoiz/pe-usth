<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t02-title t02-desc">
<title id="t02-title">start() và join(): luồng con chạy song song, main chờ ở join</title>
<desc id="t02-desc">Mã nguồn tám dòng bên trái và dòng thời gian bên phải: main chạy, t1.start() và t2.start() mở hai luồng con ngủ 2 và 3 giây, main vẫn chạy tiếp rồi đứng chờ tại t1.join() và t2.join(), cuối cùng main kết thúc. Hình vẽ hành vi THẬT của CPython: hai luồng chồng thời gian nên tổng chỉ 3 giây. Vòng lặp 16 giây, 8 bước giữ 1,8 giây mỗi bước, con trỏ thời gian nhảy theo đúng dòng mã đang sáng, thứ tự: tạo t1, tạo t2, t1.start, t2.start, main in, t1.join trả về, t2.join trả về, main kết thúc.</desc>
<defs>
<pattern id="t02hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#1c2540"/>
  <line x1="0" y1="0" x2="0" y2="8" stroke="#3a4a74" stroke-width="3"/>
</pattern>
<marker id="t02ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="#93a0bc"/>
</marker>
</defs>
<style>
  text{fill:#e8edf7;font-family:'Segoe UI',system-ui,sans-serif}
  .mono{font-family:Consolas,'Cascadia Mono','Courier New',monospace}
  .h1{font-size:25px;font-weight:600}
  .sub{font-size:14px;fill:#93a0bc}
  .ph{font-size:16px;font-weight:600}
  .cap{font-size:12px;fill:#5b6886}
  .bd{font-size:13px;fill:#93a0bc}
  .bar{font-size:12.5px}
  .ring{fill:none;stroke-width:2.5;opacity:0;animation:pulse 16s linear infinite}
  @keyframes pulse{0%{opacity:0}0.5%{opacity:1}11.5%{opacity:1}12.2%{opacity:0}100%{opacity:0}}
  .s1{animation-delay:0s}.s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}
  .s5{animation-delay:8s}.s6{animation-delay:10s}.s7{animation-delay:12s}.s8{animation-delay:14s}
  .cursor{opacity:0;animation:t02sweep 16s linear infinite}
  @keyframes t02sweep{
    0%,12%{opacity:1;transform:translateX(0px)}
    12.5%,24.5%{opacity:1;transform:translateX(0px)}
    25%,37%{opacity:1;transform:translateX(60px)}
    37.5%,49.5%{opacity:1;transform:translateX(140px)}
    50%,62%{opacity:1;transform:translateX(210px)}
    62.5%,74.5%{opacity:1;transform:translateX(290px)}
    75%,87%{opacity:1;transform:translateX(485px)}
    87.5%,100%{opacity:1;transform:translateX(595px)}
  }
  @media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
<rect width="1280" height="640" fill="#0f1626"/>

<text class="h1" x="40" y="50">start() và join(): mở luồng, rồi chờ luồng</text>
<text class="sub" x="40" y="78">start() trả về ngay, luồng con chạy song song. join() mới là chỗ luồng chính đứng lại chờ. Gọi run() thì không có luồng nào mới cả.</text>

<!-- ===== MA NGUON ===== -->
<rect x="40" y="100" width="420" height="440" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="60" y="130">Mã nguồn</text>
<text class="cap" x="440" y="130" text-anchor="end">SL 99-102</text>

<text class="mono" x="60" y="175" font-size="14" fill="#e8edf7">t1 = Worker(2)</text>
<text class="mono" x="60" y="209" font-size="14" fill="#e8edf7">t2 = Worker(3)</text>
<text class="mono" x="60" y="243" font-size="14" fill="#9cc6ff">t1.start()</text>
<text class="mono" x="60" y="277" font-size="14" fill="#9cc6ff">t2.start()</text>
<text class="mono" x="60" y="311" font-size="14" fill="#e8edf7">print("main vẫn chạy")</text>
<text class="mono" x="60" y="345" font-size="14" fill="#f5b83d">t1.join()</text>
<text class="mono" x="60" y="379" font-size="14" fill="#f5b83d">t2.join()</text>
<text class="mono" x="60" y="413" font-size="14" fill="#9fd88f">print("main xong")</text>

<rect class="ring s1" x="52" y="155" width="396" height="26" rx="4" stroke="#4c9bff"/>
<rect class="ring s2" x="52" y="189" width="396" height="26" rx="4" stroke="#4c9bff"/>
<rect class="ring s3" x="52" y="223" width="396" height="26" rx="4" stroke="#4c9bff"/>
<rect class="ring s4" x="52" y="257" width="396" height="26" rx="4" stroke="#c9a2ff"/>
<rect class="ring s5" x="52" y="291" width="396" height="26" rx="4" stroke="#4c9bff"/>
<rect class="ring s6" x="52" y="325" width="396" height="26" rx="4" stroke="#f5b83d"/>
<rect class="ring s7" x="52" y="359" width="396" height="26" rx="4" stroke="#f5b83d"/>
<rect class="ring s8" x="52" y="393" width="396" height="26" rx="4" stroke="#9fd88f"/>

<rect x="60" y="440" width="380" height="80" rx="8" fill="#141d33" stroke="#2c3a5c"/>
<text class="bd" x="74" y="464">Hai dòng join() chỉ chờ, không chạy gì thêm.</text>
<text class="bd" x="74" y="486">Bỏ join() thì main in "main xong" trước khi</text>
<text class="bd" x="74" y="506">luồng con kịp in — thứ tự đảo lộn.</text>

<!-- ===== DONG THOI GIAN ===== -->
<rect x="484" y="100" width="756" height="440" rx="10" fill="#162036" stroke="#273352"/>
<text class="ph" x="504" y="130">Dòng thời gian thực thi</text>

<text class="mono" x="682" y="158" font-size="11.5" fill="#9cc6ff">t1.start()</text>
<text class="mono" x="762" y="158" font-size="11.5" fill="#c9a2ff">t2.start()</text>

<!-- lane main -->
<text class="mono" x="504" y="191" font-size="12" fill="#93a0bc">main</text>
<rect x="620" y="166" width="210" height="40" rx="5" fill="#1b2a47" stroke="#4c9bff"/>
<text class="bar" x="725" y="191" text-anchor="middle" fill="#9cc6ff">main chạy</text>
<rect x="830" y="166" width="80" height="40" rx="5" fill="url(#t02hatch)" stroke="#f5b83d"/>
<text class="mono" x="870" y="191" font-size="11.5" text-anchor="middle" fill="#f5b83d">t1.join()</text>
<rect x="910" y="166" width="195" height="40" rx="5" fill="url(#t02hatch)" stroke="#f5b83d"/>
<text class="mono" x="1007" y="191" font-size="11.5" text-anchor="middle" fill="#f5b83d">t2.join() — main đứng chờ</text>
<rect x="1105" y="166" width="110" height="40" rx="5" fill="#1a2b22" stroke="#9fd88f"/>
<text class="bar" x="1160" y="191" text-anchor="middle" fill="#9fd88f">main xong</text>

<!-- lane t1 -->
<text class="mono" x="504" y="275" font-size="12" fill="#93a0bc">t1 = Worker(2)</text>
<rect x="680" y="250" width="230" height="40" rx="5" fill="#2a2119" stroke="#f4a274"/>
<text class="bar" x="795" y="275" text-anchor="middle" fill="#f4a274">t1 · ngủ 2 s</text>
<text class="cap" x="684" y="308">in "Finished sleeping 2s"</text>

<!-- lane t2 -->
<text class="mono" x="504" y="355" font-size="12" fill="#93a0bc">t2 = Worker(3)</text>
<rect x="760" y="330" width="345" height="40" rx="5" fill="#231c3a" stroke="#c9a2ff"/>
<text class="bar" x="932" y="355" text-anchor="middle" fill="#c9a2ff">t2 · ngủ 3 s</text>
<text class="cap" x="764" y="388">in "Finished sleeping 3s"</text>

<!-- mui ten start -->
<line x1="684" y1="208" x2="684" y2="246" stroke="#93a0bc" stroke-width="1.6" marker-end="url(#t02ar)"/>
<!-- vòng sang trái để không chạy đè lên thanh của t1 (quy tắc: không đi xuyên sau ô khác) -->
<path d="M760 208 V 232 H 666 V 350 H 754" fill="none" stroke="#93a0bc" stroke-width="1.6" marker-end="url(#t02ar)"/>
<!-- mui ten ket thuc -->
<line x1="910" y1="248" x2="910" y2="210" stroke="#f5b83d" stroke-width="1.6" marker-end="url(#t02ar)"/>
<text class="cap" x="918" y="232" fill="#f5b83d">t1 xong</text>
<line x1="1105" y1="328" x2="1105" y2="210" stroke="#f5b83d" stroke-width="1.6" marker-end="url(#t02ar)"/>
<text class="cap" x="1113" y="246" fill="#f5b83d">t2 xong</text>

<!-- truc thoi gian -->
<line x1="620" y1="410" x2="1215" y2="410" stroke="#5b6886" stroke-width="1.4" marker-end="url(#t02ar)"/>
<line x1="620" y1="405" x2="620" y2="415" stroke="#5b6886" stroke-width="1.4"/>
<text class="cap" x="620" y="430" text-anchor="middle">0 s</text>
<line x1="735" y1="405" x2="735" y2="415" stroke="#5b6886" stroke-width="1.4"/>
<text class="cap" x="735" y="430" text-anchor="middle">1 s</text>
<line x1="850" y1="405" x2="850" y2="415" stroke="#5b6886" stroke-width="1.4"/>
<text class="cap" x="850" y="430" text-anchor="middle">2 s</text>
<line x1="965" y1="405" x2="965" y2="415" stroke="#5b6886" stroke-width="1.4"/>
<text class="cap" x="965" y="430" text-anchor="middle">3 s</text>
<line x1="1080" y1="405" x2="1080" y2="415" stroke="#5b6886" stroke-width="1.4"/>
<text class="cap" x="1080" y="430" text-anchor="middle">4 s</text>
<line x1="1195" y1="405" x2="1195" y2="415" stroke="#5b6886" stroke-width="1.4"/>
<text class="cap" x="1195" y="430" text-anchor="middle">5 s</text>

<!-- con tro thoi gian (chi lam ro THU TU, tat duoc) -->
<g class="cursor">
  <line x1="620" y1="164" x2="620" y2="400" stroke="#79d3ec" stroke-width="2"/>
  <circle cx="620" cy="164" r="4" fill="#79d3ec"/>
</g>

<rect x="504" y="452" width="716" height="70" rx="8" fill="#141d33" stroke="#2c3a5c"/>
<text class="bd" x="518" y="477">Tổng thời gian là 3 s chứ không phải 5 s: hai luồng con ngủ chồng lên nhau.</text>
<text class="bd" x="518" y="500">Vùng kẻ chéo là lúc main không làm gì — nó bị join() giữ lại cho tới khi luồng con kết thúc.</text>

<text class="bd" x="40" y="578">Đây là hành vi THẬT của CPython. Studio trong bài chạy mô phỏng nối đuôi nhau, nên ở đó không thấy phần chồng thời gian này.</text>
<text class="cap" x="40" y="616">Nguồn: slide USTH 95, 99-102 (5 bước dùng thread; start() chứ không phải run(); join())</text>
</svg>
